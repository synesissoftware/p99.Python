name: CI

on:
  push:
    branches:
      - master
      - dev
      - v0
      - gha
  pull_request:
    branches:
      - master
      - dev
      - v0
      - gha

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version:
          - 3.14
          - 3.13
          - 3.12
          - 3.11
        pure-python: [false, true]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Report p99 backends
        shell: bash
        run: |
          echo "=== P99_PURE_PYTHON unset ==="
          python -c "import p99; print('__implementation__:', p99.__implementation__)"
          echo "=== P99_PURE_PYTHON=1 ==="
          P99_PURE_PYTHON=1 python -c "import p99; print('__implementation__:', p99.__implementation__)"

      - name: Run tests
        shell: bash
        env:
          P99_PURE_PYTHON: ${{ matrix.pure-python && '1' || '' }}
        run: |
          echo "=== test run: P99_PURE_PYTHON=${P99_PURE_PYTHON:-<unset>} ==="
          python -c "import p99; print('__implementation__:', p99.__implementation__)"
          pytest -v
